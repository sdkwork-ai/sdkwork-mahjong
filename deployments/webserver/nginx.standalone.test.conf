# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/mahjong/webserver.pid;
error_log /var/log/sdkwork/mahjong/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name mahjong-test.sdkwork.com mahjong-test.birdcoder.com mahjong-test.dtupay.com mahjong-test.sdkwork.cn mahjong-test.birdcoder.cn mahjong-test.dtupay.cn mahjong-test.skubc.com mahjong-test.skubc.cn mahjong-test.zowalk.com mahjong-test.zowalk.cn mahjong-test.offer86.com mahjong-test.offer86.cn mahjong-test.86offer.com mahjong-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
