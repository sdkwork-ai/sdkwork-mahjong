# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/mahjong/webserver.pid;
error_log /var/log/sdkwork/mahjong/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name mahjong-demo.sdkwork.com mahjong-demo.birdcoder.com mahjong-demo.dtupay.com mahjong-demo.noaper.com mahjong-demo.sdkwork.cn mahjong-demo.birdcoder.cn mahjong-demo.dtupay.cn mahjong-demo.noaper.cn mahjong-demo.skubc.com mahjong-demo.skubc.cn mahjong-demo.zowalk.com mahjong-demo.zowalk.cn mahjong-demo.offer86.com mahjong-demo.offer86.cn mahjong-demo.86offer.com mahjong-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/mahjong/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
