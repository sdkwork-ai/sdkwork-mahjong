# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/mahjong/webserver.pid;
error_log /var/log/sdkwork/mahjong/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name mahjong-staging.sdkwork.com mahjong-staging.birdcoder.com mahjong-staging.dtupay.com mahjong-staging.sdkwork.cn mahjong-staging.birdcoder.cn mahjong-staging.dtupay.cn mahjong-staging.skubc.com mahjong-staging.skubc.cn mahjong-staging.zowalk.com mahjong-staging.zowalk.cn mahjong-staging.offer86.com mahjong-staging.offer86.cn mahjong-staging.86offer.com mahjong-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
